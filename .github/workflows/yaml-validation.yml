name: YAML Validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v -o yaml-validator .

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62

      - name: Run tests
        run: go test ./... -v -short -coverprofile=coverage.out -covermode=atomic

      - name: Regression tests
        run: go test ./internal/regression/... -v

      - name: Validate YAML files
        run: |
          ./yaml-validator validate testdata/examples/valid.yaml testdata/examples/k8s-deployment.yaml
          ./yaml-validator validate testdata/examples/docker-compose.yaml -c configs/docker-compose.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yaml-validator .

      - name: Run validator in Docker
        run: |
          docker run --rm -v $PWD:/workspace yaml-validator validate testdata/examples/valid.yaml testdata/examples/k8s-deployment.yaml
