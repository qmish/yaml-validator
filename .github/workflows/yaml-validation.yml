name: YAML Validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v -o yaml-validator .

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

      - name: Run tests
        run: go test ./... -v -short -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          threshold=40
          total=$(go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,"",$3); print $3}')
          echo "Coverage: ${total}%"
          if [ -z "$total" ]; then echo "No coverage data"; exit 1; fi
          below=$(echo "$total < $threshold" | bc)
          if [ "$below" -eq 1 ]; then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Regression tests
        run: go test ./internal/regression/... -v

      - name: Validate YAML files
        run: |
          ./yaml-validator validate testdata/examples/valid.yaml testdata/examples/k8s-deployment.yaml
          ./yaml-validator validate testdata/examples/docker-compose.yaml -c configs/docker-compose.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yaml-validator .

      - name: Run validator in Docker
        run: |
          docker run --rm -v $PWD:/workspace yaml-validator validate testdata/examples/valid.yaml testdata/examples/k8s-deployment.yaml
