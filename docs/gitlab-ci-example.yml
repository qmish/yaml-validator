# Готовый фрагмент job для валидации YAML в GitLab CI
# Добавьте в .gitlab-ci.yml или скопируйте как референс.
# Требуется: yaml-validator — сборка из репозитория или скачать релиз.

# Вариант 1: Простая валидация (вывод severity)
yaml-validate:
  image: golang:1.24-bookworm
  stage: test
  before_script:
    - go build -o yaml-validator .
  script:
    - ./yaml-validator validate "**/*.yml" "**/*.yaml" -o severity
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

