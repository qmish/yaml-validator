# Конфигурация с проверкой по полной OpenAPI-схеме Kubernetes (типы полей, все ресурсы)
rules:
  check_syntax: true
  check_duplicates: true
  check_integrity: true
  check_common_errors: true
  k8s_schema:
    enabled: true
    version: master
    strict: false
    cache_dir: ""
    ignore_missing_schemas: true
  required_fields:
    - apiVersion
    - kind
    - metadata.name
  max_line_length: 200
  sensitive_patterns:
    - password
    - secret
    - token
    - key
