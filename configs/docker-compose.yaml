# Конфигурация для проверки docker-compose и других YAML (не K8s)
rules:
  check_syntax: true
  check_duplicates: true
  check_integrity: false  # без обязательных K8s-полей
  check_common_errors: true
  required_fields: []
  max_line_length: 200
  sensitive_patterns:
    - password
    - secret
    - token
    - key
