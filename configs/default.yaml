rules:
  check_syntax: true
  check_duplicates: true
  check_integrity: true
  check_common_errors: true
  style:
    require_document_start: false
    forbid_trailing_spaces: false
    require_newline_at_eof: false
  k8s_schema:
    enabled: false
    version: master
    strict: false
    cache_dir: ""
    ignore_missing_schemas: true
  required_fields:
    - apiVersion
    - kind
    - metadata.name
  max_line_length: 200
  sensitive_patterns:
    - password
    - secret
    - token
    - key
