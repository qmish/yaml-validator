# Строгие правила стиля (в духе yamllint)
rules:
  check_syntax: true
  check_duplicates: true
  check_integrity: true
  check_common_errors: true
  style:
    require_document_start: true
    forbid_trailing_spaces: true
    require_newline_at_eof: true
  k8s_schema:
    enabled: false
  required_fields: []
  max_line_length: 200
  sensitive_patterns:
    - password
    - secret
    - token
    - key
