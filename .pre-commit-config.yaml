# Pre-commit: проверка YAML перед коммитом
# Установка: pre-commit install
# См. https://pre-commit.com/

# Вариант 1: Official hook — устанавливается из репозитория (требуется Go)
repos:
  - repo: https://github.com/qmish/yaml-validator
    rev: v1.36.0  # укажите нужную версию
    hooks:
      - id: yaml-validator

# Вариант 2: Local — yaml-validator должен быть в PATH (бинарник или go build)
